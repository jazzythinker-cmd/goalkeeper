name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.GK_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages and copy the app into the Android project
        run: |
          npm ci
          npx cap sync android

      - name: Restore the upload key
        if: env.HAS_KEY == 'true'
        env:
          GK_KEYSTORE_BASE64: ${{ secrets.GK_KEYSTORE_BASE64 }}
          GK_KEYSTORE_PASSWORD: ${{ secrets.GK_KEYSTORE_PASSWORD }}
          GK_KEY_ALIAS: ${{ secrets.GK_KEY_ALIAS }}
        run: |
          # Ignore spaces and line breaks picked up when the secret was pasted
          printf '%s' "$GK_KEYSTORE_BASE64" | tr -d '[:space:]' > "$RUNNER_TEMP/key.b64"
          echo "Key text length after cleanup: $(wc -c < "$RUNNER_TEMP/key.b64") characters (expected 3712)"
          if ! base64 -d "$RUNNER_TEMP/key.b64" > "$RUNNER_TEMP/upload.jks"; then
            echo "::error::GK_KEYSTORE_BASE64 is not valid key text. Paste the whole contents of GK_KEYSTORE_BASE64.txt again."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$(printf '%s' "$GK_KEYSTORE_PASSWORD" | tr -d '[:space:]')" -alias "$(printf '%s' "$GK_KEY_ALIAS" | tr -d '[:space:]')" > /dev/null; then
            echo "::error::The key file opened, but GK_KEYSTORE_PASSWORD or GK_KEY_ALIAS does not match it. Check those two secrets."
            exit 1
          fi
          echo "Upload key restored and checked."

      - name: Build test APK and Play Store bundle
        working-directory: android
        env:
          GK_KEYSTORE_PATH: ${{ env.HAS_KEY == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          GK_KEYSTORE_PASSWORD: ${{ secrets.GK_KEYSTORE_PASSWORD }}
          GK_KEY_ALIAS: ${{ secrets.GK_KEY_ALIAS }}
          GK_KEY_PASSWORD: ${{ secrets.GK_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          export GK_KEYSTORE_PASSWORD="$(printf '%s' "$GK_KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          export GK_KEY_PASSWORD="$(printf '%s' "$GK_KEY_PASSWORD" | tr -d '[:space:]')"
          export GK_KEY_ALIAS="$(printf '%s' "$GK_KEY_ALIAS" | tr -d '[:space:]')"
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Save the test APK
        uses: actions/upload-artifact@v5
        with:
          name: goalkeeper-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Save the Play Store bundle
        uses: actions/upload-artifact@v5
        with:
          name: goalkeeper-play-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
